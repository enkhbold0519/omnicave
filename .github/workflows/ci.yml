
name: OmniCave CI

on:
  push:
    branches:
      - main
      - tests-ci
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Backend tests using SQLite
  backend-sqlite:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -v

  # 2. Backend tests using PostgreSQL 17
  backend-postgresql:
    name: Backend Tests (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: omnicave_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnicave_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omnicave_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -v

  # 3. Verify AI prompt synchronization
  prompt-sync:
    name: AI Prompt Synchronization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check prompt synchronization
        run: python AI-7B/check_prompt_sync.py

  # 4. Build the webOS display
  webos-build:
    name: webOS Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webos/wine-cellar-display/package-lock.json

      - name: Install dependencies
        working-directory: webos/wine-cellar-display
        run: npm ci

      - name: Build webOS display
        working-directory: webos/wine-cellar-display
        run: npm run build

  # 5. Compile the Android application
  android-build:
    name: Android Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0"

      - name: Configure local properties
        working-directory: mobile/Kotlin
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          printf "API_BASE=https://example.invalid\n" >> local.properties

      - name: Compile Android application
        working-directory: mobile/Kotlin
        run: bash ./gradlew :app:assembleDebug --no-daemon
