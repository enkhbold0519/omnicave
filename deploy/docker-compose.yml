# CellarOS production stack:  cd deploy && docker compose up -d --build
#   caddy  : HTTPS (automatic Let's Encrypt certificate) -> api
#   api    : FastAPI backend (../backend)
#   db     : PostgreSQL 17, data in the `pgdata` volume
#   backup : nightly pg_dump into ./backups, keeps BACKUP_KEEP_DAYS days
# Settings come from deploy/.env (copy .env.production.example).
name: cellaros

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cellar
      POSTGRES_USER: cellar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellar -d cellar"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cellar:${POSTGRES_PASSWORD}@db:5432/cellar
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates - keep this volume
      - caddy_config:/config
    depends_on:
      - api

  backup:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: cellar
      PGDATABASE: cellar
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
