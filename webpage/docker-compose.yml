services:
  db:
    image: postgres:17
    environment: {POSTGRES_USER: omnicave, POSTGRES_PASSWORD: omnicave, POSTGRES_DB: omnicave}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U omnicave"], interval: 3s, retries: 20}
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://omnicave:omnicave@db:5432/omnicave
      SECRET_KEY: change-me-in-production
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
