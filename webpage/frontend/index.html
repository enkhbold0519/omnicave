<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>OmniCave for Windows</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eceaf0;--sf:#fff;--tx:#1d1a22;--mu:#675f70;--ac:#7b1e3a;--bd:#d9d5df;--ok:#1f7a4d;--wn:#a35f00;--er:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16131a;--sf:#221e29;--tx:#f0ecf3;--mu:#a69daf;--ac:#e0839f;--bd:#383242;--ok:#6fcf97;--wn:#f2b45a;--er:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16131a;--sf:#221e29;--tx:#f0ecf3;--mu:#a69daf;--ac:#e0839f;--bd:#383242;--ok:#6fcf97;--wn:#f2b45a;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%}*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#root{height:100%}.app{display:grid;grid-template:auto 1fr auto/210px 1fr;height:100%}
.tb,.sb{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:6px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.sb{border:0;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{text-align:left;border:0;background:none;color:var(--tx);padding:9px 12px;border-radius:6px;cursor:pointer;font:inherit}
.nav button:hover{background:var(--sf)}.nav button.on{background:var(--sf);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
.main{overflow:auto;padding:6px 22px 22px}h2{font-weight:600;font-size:22px}h3,h4{margin:.2em 0 .5em}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
button,input,select{font:inherit}input,select{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx)}
.btn{background:var(--ac);color:var(--sf);border:1px solid var(--ac);border-radius:6px;padding:6px 14px;cursor:pointer}.btn.g{background:transparent;color:var(--tx);border-color:var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.btn:disabled{opacity:.4}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.chip{padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.mu{color:var(--mu)}
.zh{margin:10px 0 4px;font-size:13px}.shelf{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:6px;margin-bottom:6px;align-items:center}
.slot{height:34px;border-radius:6px;border:1px dashed var(--bd);cursor:pointer}.slot.f{border:0}.s0{background:#d6ad3f}.s1{background:#b9c77a}.s2{background:#6e1530}
.slot.h{outline:3px solid var(--ac);outline-offset:1px;animation:p 1s 2}@keyframes p{50%{transform:scale(1.12)}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal>div{background:var(--sf);border-radius:10px;padding:18px;max-width:560px;width:100%;max-height:90%;overflow:auto}
.bub{border-left:3px solid var(--bd);padding:4px 10px;margin:8px 0}
@media(max-width:760px){.app{grid-template:auto auto 1fr auto/1fr}.tb,.sb{grid-column:1}.nav{flex-direction:row;overflow-x:auto}.g3,.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="root"></div><div id="md"></div>
<script>
const Y=2026,$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),f=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const W=[[1,'Brut Réserve','Maison Lacroix','Champagne','Chardonnay',2018,'sparkling',2024,2032,85],[2,'Chablis Premier Cru','Domaine Vaillant','Burgundy','Chardonnay',2020,'white',2024,2030,62],[3,'Riesling Spätlese','Weingut Hartmann','Mosel','Riesling',2019,'white',2023,2034,38],[4,'Sancerre','Domaine Roche','Loire','Sauvignon Blanc',2022,'white',2024,2027,29],[5,'Barolo','Cantina Rossi','Piedmont','Nebbiolo',2016,'red',2027,2040,120],[6,'Cuvée Médoc','Château Brun','Bordeaux','Cabernet Sauvignon',2015,'red',2025,2038,210],[7,'Pinot Noir Reserve','Willow Ridge','Oregon','Pinot Noir',2019,'red',2024,2031,58],[8,'Rioja Gran Reserva','Bodegas Ibarra','Rioja','Tempranillo',2012,'red',2022,2032,74],[9,'Syrah','Domaine Ferrand','Rhône','Syrah',2018,'red',2024,2034,66],[10,'Cuvée Prestige','Maison Lacroix','Champagne','Pinot Noir',2012,'sparkling',2022,2030,160]].map(a=>({id:a[0],n:a[1],w:a[2],r:a[3],g:a[4],v:a[5],s:a[6],a:a[7],b:a[8],p:a[9]}));
let wn=10;
const B=[[1,'sig',1,1],[1,'sig',1,2],[10,'sig',2,3],[2,'sig',4,1],[3,'sig',4,2],[3,'sig',5,3],[4,'sig',6,1],[5,'sig',8,2],[5,'sig',8,3],[6,'sig',9,1],[7,'sig',10,4],[9,'sig',11,2],[1,'sig',0,0],[8,'res',8,1],[6,'res',9,2],[5,'res',10,3],[7,'res',12,1],[2,'res',4,3],[1,'res',2,2]].map((a,i)=>({id:'B'+(i+1),w:a[0],c:a[1],sh:a[2],po:a[3]}));let bn=B.length;
const C=[{id:'sig',n:'The Signature Cellar'},{id:'res',n:'Private Reserve'}];
const E={sig:{t:[7.1,10.4,14.2],h:[68,66,64],a:2},res:{t:[7,10.5,18.3],h:[52,60,63],a:180}};
const TG=[[5,9],[8,12],[12,16]],HT=[55,75],ZN=['Sparkling','White','Red'],ST=['sparkling','white','red'];
const FP={sparkling:'oysters, fried chicken, salty snacks',white:'grilled fish, salads, creamy pasta; delivery: sushi or Thai',red:'steak, lamb, mushroom pasta; delivery: burgers or BBQ'};
let U=[{e:'alex@cellaros.app',p:'Cellar#2026'}];const S={u:null,v:'inv',c:'sig',q:'',st:'',mode:'in',th:'system'};
const wid=id=>W.find(w=>w.id==id),zn=sh=>sh<=3?0:sh<=7?1:2,cn=id=>(C.find(c=>c.id==id)||{}).n,vis=()=>B.filter(b=>S.c=='all'||b.c==S.c);
const ready=w=>Y>=w.a&&Y<=w.b,soon=w=>w.a==Y+1,wst=w=>ready(w)?['Ready','ok']:soon(w)?['Soon','wn']:Y<w.a?['Aging','mu']:['Past peak','er'];
const mk=w=>Math.round(w.p*(1+Math.min(Y-w.v,15)*.008)),hist=w=>Array.from({length:12},(_,i)=>Math.round(mk(w)*(.9+i*.009+Math.sin(i+w.id)*.01)));
const loc=b=>b.sh?`Shelf ${b.sh}, position ${b.po}`:'Location unavailable';
const mt=b=>{const w=wid(b.w);return !S.q||f([w.n,w.w,w.r,w.v,w.g].join(' ')).includes(f(S.q))};
const mo=h=>{$('#md').innerHTML=h?`<div class="modal" onclick="if(event.target==this)mo()"><div>${h}</div></div>`:''};
const EM=/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i,PW=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/;
function alerts(){const o=[];C.forEach(c=>{const e=E[c.id];ZN.forEach((z,i)=>{if(e.t[i]<TG[i][0]||e.t[i]>TG[i][1])o.push(`${cn(c.id)}: ${z} zone temperature ${e.t[i]}°C is outside ${TG[i][0]}–${TG[i][1]}°C`);if(e.h[i]<HT[0]||e.h[i]>HT[1])o.push(`${cn(c.id)}: ${z} humidity ${e.h[i]}% is outside ${HT[0]}–${HT[1]}%`)});if(e.a>60)o.push(`${cn(c.id)}: sensor data is outdated (last update ${Math.round(e.a/60)} h ago)`)});return o}
function render(){$('#root').innerHTML=S.u?shell():authv()}
/* auth */
function authv(){const su=S.mode=='up';return `<div class="card" style="max-width:380px;margin:8vh auto"><h2>🍷 OmniCave</h2><p class="mu">${su?'Create your account':'Log in to your cellars'}</p>${S.note?`<p class="ok">${S.note}</p>`:''}<label>Email<br><input id="em" type="email" oninput="vs()" style="width:100%"></label><br><br><label>Password<br><input id="pw" type="password" oninput="vs()" style="width:100%"></label>${su?`<br><br><label>Confirm password<br><input id="pw2" type="password" oninput="vs()" style="width:100%"></label>`:''}<p id="er" class="er"></p><div class="bar"><button id="go" class="btn" onclick="auth()" ${su?'disabled':''}>${su?'Sign up':'Log in'}</button><button class="btn g" onclick="S.mode='${su?'in':'up'}';S.note='';render()">${su?'Back to log in':'Create account'}</button></div>${su?'':'<p class="mu">Demo account: alex@cellaros.app / Cellar#2026</p>'}</div>`}
function vs(){if(S.mode!='up')return;const e=$('#em').value,p=$('#pw').value,q=$('#pw2').value,a=EM.test(e),b=PW.test(p);$('#go').disabled=!(a&&b&&p==q);$('#er').textContent=!e?'':!a?'Enter a valid email.':p&&!b?'Password needs 8+ characters with upper, lower, number and symbol.':p&&q&&p!=q?'Passwords do not match.':''}
function auth(){const e=$('#em').value.trim(),p=$('#pw').value;if(S.mode=='up'){if(U.some(u=>u.e==e))return $('#er').textContent='That email is already registered.';U.push({e,p});S.mode='in';S.note='Account created. Log in to continue.';return render()}const u=U.find(x=>x.e==e&&x.p==p);if(!u)return $('#er').textContent='Invalid email or password';S.u=u.e;S.note='';S.v='inv';render()}
/* shell */
function shell(){const N=[['inv','📦 Inventory'],['map','🗺️ Cellar map'],['env','🌡️ Environment'],['ai','🤖 Sommelier AI'],['val','📰 Briefing & value'],['pro','👤 Profile']],n=alerts().length+B.filter(b=>soon(wid(b.w))).length,V={inv,map:mapv,env:envv,ai:aiv,val:valv,pro:prov};
return `<div class="app"><div class="tb"><b>🍷 OmniCave</b><span class="mu">Integrated display for Windows</span><span style="flex:1"></span><select aria-label="Cellar" onchange="S.c=this.value;render()">${C.map(c=>`<option value="${c.id}" ${S.c==c.id?'selected':''}>${esc(c.n)}</option>`).join('')}<option value="all" ${S.c=='all'?'selected':''}>All cellars</option></select><button class="btn g" onclick="notes()">🔔 ${n}</button></div><nav class="nav">${N.map(([k,l])=>`<button class="${S.v==k?'on':''}" onclick="S.v='${k}';render()">${l}</button>`).join('')}</nav><main class="main">${V[S.v]()}</main><div class="sb"><span>${navigator.onLine?'● Online':'○ Offline'}</span><span>Signed in as ${esc(S.u)}</span><span>${C.length} cellars synced</span></div></div>`}
function notes(){const s=B.filter(b=>soon(wid(b.w))).map(b=>`${wid(b.w).n} ${wid(b.w).v} enters its drinking window in ${wid(b.w).a}`);mo(`<h3>Notifications</h3>${[...alerts(),...s].map(x=>`<p>• ${esc(x)}</p>`).join('')||'<p class="mu">All clear.</p>'}<p class="mu">${B.filter(b=>ready(wid(b.w))).length} bottles are ready to drink now.</p><button class="btn g" onclick="mo()">Close</button>`)}
/* inventory */
function inv(){return `<h2>Inventory</h2><div class="bar"><input aria-label="Search" placeholder="Search wine, winery, region, vintage or grape" value="${esc(S.q)}" oninput="setq(this.value)" style="flex:1;min-width:220px"><select aria-label="Style" onchange="S.st=this.value;setq(S.q)"><option value="">All styles</option>${ST.map(s=>`<option ${S.st==s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="edit()">＋ Add bottle</button></div><div class="card" style="overflow:auto"><div id="list">${lst()}</div></div>`}
const setq=v=>{S.q=v;$('#list').innerHTML=lst()};
function lst(){const r=vis().filter(b=>mt(b)&&(!S.st||wid(b.w).s==S.st));return `<table><tr><th>Wine</th><th>Vintage</th><th>Grape</th><th>Region</th>${S.c=='all'?'<th>Cellar</th>':''}<th>Location</th><th>Window</th></tr>${r.map(b=>{const w=wid(b.w);return `<tr class="r" onclick="det('${b.id}')"><td>${esc(w.n)}<br><span class="mu">${esc(w.w)}</span></td><td>${w.v}</td><td>${esc(w.g)}</td><td>${esc(w.r)}</td>${S.c=='all'?`<td>${esc(cn(b.c))}</td>`:''}<td>${loc(b)}</td><td><span class="chip ${wst(w)[1]}">${wst(w)[0]}</span></td></tr>`}).join('')}</table>${r.length?'':'<p class="mu">No bottles match. Clear the search or add a bottle.</p>'}<p class="mu">${r.length} bottles</p>`}
function det(id){const b=B.find(x=>x.id==id),w=wid(b.w),e=E[b.c],z=zn(b.sh||8);mo(`<h3>${esc(w.n)} ${w.v}</h3><p class="mu">${esc(w.w)} · ${esc(w.r)} · ${esc(w.g)}</p><p>Bottle ${b.id} in ${esc(cn(b.c))}<br>${loc(b)}${b.sh?` — ${ZN[z]} zone, ${e.t[z]}°C, ${e.h[z]}% humidity`:''}<br>Drinking window ${w.a}–${w.b} <span class="chip ${wst(w)[1]}">${wst(w)[0]}</span><br>Estimated market value $${mk(w)}<br>Pairs with ${FP[w.s]}</p><div class="bar">${b.sh?`<button class="btn" onclick="show('${b.id}')">Show on map</button>`:''}<button class="btn g" onclick="debate(${w.id})">Critic debate</button><button class="btn g" onclick="edit('${b.id}')">Edit</button><button class="btn g" onclick="rmq('${b.id}')">Remove</button><button class="btn g" onclick="mo()">Close</button></div>`)}
function show(id){const b=B.find(x=>x.id==id);S.c=b.c;S.hl=id;S.v='map';mo();render()}
function rmq(id){mo(`<h3>Remove this bottle?</h3><p>It will leave the active inventory.</p><div class="bar"><button class="btn" onclick="B.splice(B.findIndex(x=>x.id=='${id}'),1);mo();render()">Remove bottle</button><button class="btn g" onclick="mo()">Keep</button></div>`)}
const EX=[['Pinot Noir','Domaine Lune','Burgundy','Pinot Noir',2020,'red'],['Prosecco Superiore','Cantina Colli','Veneto','Glera',2024,'sparkling'],['Vermentino','Tenuta Mare','Sardinia','Vermentino',2023,'white']];
function edit(id){const b=id&&B.find(x=>x.id==id),w=b?wid(b.w):{n:'',w:'',r:'',g:'',v:'',s:'red'},pr=S.pre;S.pre=null;S.ed=id||'';const c=pr?pr[0]:b?b.c:S.c,sh=pr?pr[1]:b&&b.sh||'',po=pr?pr[2]:b&&b.po||'';
mo(`<h3>${b?'Edit bottle':'Add bottle'}</h3>${b?'':'<button class="btn g" onclick="scan()">📷 Scan label (simulated AI)</button><p id="sn" class="mu"></p>'}<div class="g2">${[['n','Wine name',w.n],['w','Winery',w.w],['r','Region',w.r],['g','Grape',w.g],['v','Vintage',w.v]].map(([k,l,v])=>`<label>${l}<br><input id="f_${k}" value="${esc(v)}" style="width:100%"></label>`).join('')}<label>Style<br><select id="f_s" style="width:100%">${ST.map(s=>`<option ${w.s==s?'selected':''}>${s}</option>`).join('')}</select></label><label>Cellar<br><select id="f_c" style="width:100%">${C.map(x=>`<option value="${x.id}" ${c==x.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select></label><label>Shelf (1–13)<br><input id="f_sh" type="number" value="${sh}" style="width:100%"></label><label>Position (1–5)<br><input id="f_po" type="number" value="${po}" style="width:100%"></label></div><p id="fe" class="er"></p><div class="bar"><button class="btn" onclick="save()">Save changes</button><button class="btn g" onclick="mo()">Cancel</button></div>`)}
function scan(){const x=EX[Math.random()*3|0];['n','w','r','g','v','s'].forEach((k,i)=>$('#f_'+k).value=x[i]);const c=$('#f_c').value,R=[[1,3],[4,7],[8,13]][ST.indexOf(x[5])];let L=null;for(let sh=R[0];sh<=R[1]&&!L;sh++)for(let p=1;p<=5;p++)if(!B.some(b=>b.c==c&&b.sh==sh&&b.po==p)){L=[sh,p];break}if(L){$('#f_sh').value=L[0];$('#f_po').value=L[1]}$('#sn').textContent='Details and a suggested location were extracted. Review and correct them, then save.'}
function save(){const g=k=>$('#f_'+k).value.trim(),n=g('n'),v=+g('v'),c=g('c'),sh=+g('sh')||0,po=+g('po')||0,er=$('#fe');
if(!n||!g('w')||!v)return er.textContent='Name, winery and vintage are required.';
if(!sh!=!po||sh>13||po>5||sh<0||po<0)return er.textContent='Enter shelf 1–13 and position 1–5, or leave both empty.';
if(sh&&B.some(x=>x.c==c&&x.sh==sh&&x.po==po&&x.id!=S.ed))return er.textContent='That position is occupied.';
const old=S.ed&&B.find(x=>x.id==S.ed),nw={...(old?wid(old.w):{a:Y,b:Y+8,p:50}),id:++wn,n,w:g('w'),r:g('r'),g:g('g'),v,s:g('s')};W.push(nw);
if(old)Object.assign(old,{w:nw.id,c,sh,po});else B.push({id:'B'+(++bn),w:nw.id,c,sh,po});mo();render()}
/* map */
function grid(c){const e=E[c];let h='';for(let sh=1;sh<=13;sh++){const z=zn(sh);if([1,4,8].includes(sh))h+=`<div class="zh"><b>${ZN[z]}</b> · Now ${e.t[z]}°C, target ${TG[z][0]}–${TG[z][1]}°C${e.a>60?' · stale reading':''}</div>`;h+=`<div class="shelf"><span class="mu">${sh}</span>`;for(let p=1;p<=5;p++){const b=B.find(x=>x.c==c&&x.sh==sh&&x.po==p);if(!b){h+=`<div class="slot" aria-label="Empty shelf ${sh} position ${p}" onclick="empty('${c}',${sh},${p})"></div>`;continue}const w=wid(b.w),hit=S.hl==b.id||(S.q&&mt(b));h+=`<div class="slot f s${ST.indexOf(w.s)}${hit?' h':''}" style="${S.q&&!hit?'opacity:.3':''}" title="${esc(w.n)} ${w.v}" onclick="det('${b.id}')"></div>`}h+='</div>'}return h}
function mapv(){const c=S.c=='all'?'sig':S.c,np=B.filter(b=>b.c==c&&!b.sh);return `<h2>Cellar map · ${esc(cn(c))}</h2><div class="bar"><input aria-label="Find bottles" placeholder="Find bottles on the map" value="${esc(S.q)}" oninput="S.q=this.value;S.hl=null;$('#mp').innerHTML=grid('${c}')"></div><div class="card" id="mp">${grid(c)}</div>${np.length?`<div class="card"><h3>Not placed</h3>${np.map(b=>`<button class="btn g" onclick="det('${b.id}')">${esc(wid(b.w).n)}</button>`).join(' ')}</div>`:''}`}
const empty=(c,sh,p)=>mo(`<h3>Empty position</h3><p>Shelf ${sh}, position ${p}</p><div class="bar"><button class="btn" onclick="S.pre=['${c}',${sh},${p}];edit()">Add a bottle here</button><button class="btn g" onclick="mo()">Close</button></div>`);
/* environment */
const spark=(c,i)=>{const t=E[c].t[i],p=Array.from({length:24},(_,k)=>t+Math.sin(k/3+i)*.5),mn=Math.min(...p),mx=Math.max(...p);return `<svg viewBox="0 0 160 36" width="100%" height="36" role="img" aria-label="24 hour temperature history"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${p.map((v,k)=>`${k*160/23},${34-(v-mn)/(mx-mn||1)*30}`).join(' ')}"/></svg>`};
function envv(){const cs=C.filter(c=>S.c=='all'||c.id==S.c),th=ZN.map((z,i)=>`<div class="bar"><b style="width:80px">${z}</b>Temperature <input type="number" step=".5" value="${TG[i][0]}" onchange="TG[${i}][0]=+this.value;render()" style="width:76px"> to <input type="number" step=".5" value="${TG[i][1]}" onchange="TG[${i}][1]=+this.value;render()" style="width:76px"> °C</div>`).join('');
return `<h2>Environment</h2>${cs.map(c=>{const e=E[c.id];return `<div class="card"><h3>${esc(c.n)} <span class="chip ${e.a>60?'er':'ok'}">${e.a>60?'Sensor offline':'Live'}</span></h3><div class="g3">${ZN.map((z,i)=>{const bad=e.t[i]<TG[i][0]||e.t[i]>TG[i][1]||e.h[i]<HT[0]||e.h[i]>HT[1];return `<div><b>${z}</b> <span class="chip ${bad?'wn':'ok'}">${bad?'Alert':'OK'}</span><br>${e.t[i]}°C · ${e.h[i]}% humidity<br><span class="mu">Target ${TG[i][0]}–${TG[i][1]}°C</span>${spark(c.id,i)}<span class="mu">Last 24 h (simulated)</span></div>`}).join('')}</div></div>`}).join('')}<div class="card"><h3>Active alerts</h3>${alerts().map(a=>`<p class="wn">• ${esc(a)}</p>`).join('')||'<p class="mu">No alerts.</p>'}</div><div class="card"><h3>Alert thresholds</h3>${th}<div class="bar">Humidity <input type="number" value="${HT[0]}" onchange="HT[0]=+this.value;render()" style="width:76px"> to <input type="number" value="${HT[1]}" onchange="HT[1]=+this.value;render()" style="width:76px"> % · alert after <input type="number" value="15" style="width:64px"> min</div></div>`}
/* AI */
